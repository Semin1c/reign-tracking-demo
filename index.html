<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ontario Jr. Reign — Zone, Possession & Shot Tracking</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: inherit; }
  html, body {
    background: #09090b;
    color: #f4f4f5;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .edit-on [data-edit] { outline: 1px dashed rgba(34,211,238,.6); outline-offset: 2px; cursor: text; border-radius: 3px; }
  .edit-on [data-edit]:hover { background: rgba(34,211,238,.15); }
</style>
</head>
<body class="bg-zinc-950">

<div id="page-root"></div>

<script src="content.js"></script>
<script>
  window.DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
  try {
    var saved = localStorage.getItem("reign-demo-content");
    if (saved) window.CONTENT = JSON.parse(saved);
  } catch (e) {}
</script>
<script type="text/babel" data-presets="react">
const { useState, useContext, useEffect, createContext } = React;

function RadioIcon({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="2" />
      <path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 1 0 14.14" />
    </svg>
  );
}
function PauseIcon({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="10" />
      <line x1="10" y1="9" x2="10" y2="15" />
      <line x1="14" y1="9" x2="14" y2="15" />
    </svg>
  );
}
function TrashIcon({ size = 13, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <polyline points="3 6 5 6 21 6" />
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    </svg>
  );
}


const C = window.CONTENT;
const T = C.demo;

// ---------- in-page editing support ----------
const EditCtx = createContext({ editing: false, bump: () => {}, openEditor: () => {} });
const getPath = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const setPath = (obj, path, val) => {
  const keys = path.split(".");
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = val;
};
const saveContent = () => {
  try { localStorage.setItem("reign-demo-content", JSON.stringify(window.CONTENT)); } catch (e) {}
};

// Text that can be clicked and edited when edit mode is on.
// nav = the text sits on a button you still need to click normally (edit those in the panel at the bottom).
function Ed({ p, nav, rich }) {
  const { editing } = useContext(EditCtx);
  const val = getPath(C, p);
  const shown = rich ? <RichText text={val || ""} /> : val;
  if (!editing || nav) return <>{shown}</>;
  return <span data-edit={p}>{shown || "(empty)"}</span>;
}
const PERIODS = Object.keys(C.data.periods);
const ZONES = ["D", "N", "O"].map((id) => ({ id, get label() { return T.zoneNames[id]; } }));
const POSSESSIONS = ["reign", "opp", "battle"].map((id) => ({ id, get label() { return T.possessionNames[id]; } }));
const SHOT_ZONES = [
  { id: "DL", x: 4, y: 4, w: 94, h: 46 },
  { id: "DC", x: 4, y: 52, w: 94, h: 46 },
  { id: "DR", x: 4, y: 100, w: 94, h: 46 },
  { id: "NL", x: 102, y: 4, w: 94, h: 46 },
  { id: "NC", x: 102, y: 52, w: 94, h: 46 },
  { id: "NR", x: 102, y: 100, w: 94, h: 46 },
  { id: "OL", x: 200, y: 4, w: 96, h: 46 },
  { id: "OC", x: 200, y: 52, w: 96, h: 46 },
  { id: "OR", x: 200, y: 100, w: 96, h: 46 },
];

function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

const PERIOD_DATA = C.data.periods;
const EXAMPLE_LOG = C.data.activityLog;

function aggregate(selected, pick) {
  const acc = {};
  selected.forEach((p) => {
    const src = pick(PERIOD_DATA[p]);
    Object.keys(src).forEach((k) => (acc[k] = (acc[k] || 0) + src[k]));
  });
  return acc;
}
function aggregateJoint(selected) {
  const acc = { D: { reign: 0, opp: 0, battle: 0 }, N: { reign: 0, opp: 0, battle: 0 }, O: { reign: 0, opp: 0, battle: 0 } };
  selected.forEach((p) => {
    ZONES.forEach((z) => POSSESSIONS.forEach((ps) => (acc[z.id][ps.id] += PERIOD_DATA[p].joint[z.id][ps.id])));
  });
  return acc;
}

function periodsLabel(selected) {
  if (selected.length === PERIODS.length) return <Ed p="demo.main.wholeGameLabel" />;
  if (selected.length === 0) return <Ed p="demo.main.nothingSelectedLabel" />;
  return <><Ed p="demo.main.periodPrefix" />{selected.join(" + ")}</>;
}

function ReportRows({ buckets, labels }) {
  const total = Object.values(buckets).reduce((a, b) => a + b, 0);
  return (
    <div className="space-y-1.5">
      {labels.map((l) => {
        const v = buckets[l.id] || 0;
        const pct = total > 0 ? Math.round((v / total) * 100) : 0;
        return (
          <div key={l.id} className="flex items-center gap-2">
            <span className="text-xs text-zinc-400 w-20 shrink-0">{l.label}</span>
            <div className="flex-1 h-2 rounded-full bg-zinc-800 overflow-hidden">
              <div
                className={`h-full ${
                  l.id === "D" ? "bg-rose-500" : l.id === "O" ? "bg-emerald-500" : l.id === "reign" ? "bg-cyan-500" : l.id === "opp" ? "bg-amber-500" : "bg-zinc-500"
                }`}
                style={{ width: `${pct}%` }}
              />
            </div>
            <span className="text-xs font-semibold text-zinc-300 w-20 text-right">
              {fmtTime(v)} <span className="text-zinc-600">{pct}%</span>
            </span>
          </div>
        );
      })}
    </div>
  );
}

function ZoneTimeCard({ zone, value, total }) {
  const [expanded, setExpanded] = useState(false);
  const pct = total > 0 ? Math.round((value / total) * 100) : 0;
  return (
    <button
      onClick={() => setExpanded((v) => !v)}
      className="w-full text-left rounded-xl border border-zinc-700 bg-zinc-900 p-3 hover:border-cyan-600 transition-colors"
    >
      <div className="flex items-center justify-between">
        <span className="text-sm font-semibold text-zinc-200">{zone.label}</span>
        <span className="text-xl font-extrabold text-cyan-400">{pct}%</span>
      </div>
      <div className="h-2 rounded-full bg-zinc-800 overflow-hidden mt-2">
        <div className="h-full bg-cyan-500" style={{ width: `${pct}%` }} />
      </div>
      <div className={`mt-2 text-xs text-zinc-500 ${expanded ? "block" : "hidden"} sm:block`}>{fmtTime(value)} <Ed p="demo.main.zoneTimeDetail" /></div>
    </button>
  );
}

function PossessionZoneCard({ zone, row }) {
  const [expanded, setExpanded] = useState(false);
  const total = row.reign + row.opp + row.battle;
  const shares = POSSESSIONS.map((p) => ({ ...p, val: row[p.id], pct: total > 0 ? Math.round((row[p.id] / total) * 100) : 0 }));
  const colorFor = (id) => (id === "reign" ? "bg-cyan-500" : id === "opp" ? "bg-amber-500" : "bg-zinc-500");
  const textColorFor = (id) => (id === "reign" ? "text-cyan-400" : id === "opp" ? "text-amber-400" : "text-zinc-400");
  return (
    <button
      onClick={() => setExpanded((v) => !v)}
      className="w-full text-left rounded-xl border border-zinc-700 bg-zinc-900 p-3 hover:border-cyan-600 transition-colors"
    >
      <div className="flex items-center justify-between mb-2">
        <span className="text-sm font-semibold text-zinc-200">{zone.label}</span>
        <span className="text-xs text-zinc-500">{fmtTime(total)}</span>
      </div>
      <div className="h-3 rounded-full overflow-hidden flex bg-zinc-800">
        {shares.map((s) => (
          <div key={s.id} style={{ width: `${s.pct}%` }} className={colorFor(s.id)} title={`${s.label} ${s.pct}%`} />
        ))}
      </div>
      <div className={`mt-2.5 flex flex-wrap gap-x-3 gap-y-1 ${expanded ? "flex" : "hidden"} sm:flex`}>
        {shares.map((s) => (
          <span key={s.id} className={`text-xs font-semibold ${textColorFor(s.id)} flex items-center gap-1`}>
            <span className={`inline-block w-2 h-2 rounded-sm ${colorFor(s.id)}`} />
            {s.label} {s.pct}%
          </span>
        ))}
      </div>
    </button>
  );
}

function RinkMarkings() {
  return (
    <>
      <rect x="2" y="2" width="296" height="146" rx="34" fill="none" stroke="#52525b" strokeWidth="2" />
      <line x1="100" y1="2" x2="100" y2="148" stroke="#3b82f6" strokeWidth="3" />
      <line x1="200" y1="2" x2="200" y2="148" stroke="#3b82f6" strokeWidth="3" />
      <line x1="150" y1="2" x2="150" y2="148" stroke="#ef4444" strokeWidth="2" />
      <circle cx="150" cy="75" r="16" fill="none" stroke="#60a5fa" strokeWidth="1.5" opacity="0.55" />
      <circle cx="150" cy="75" r="1.5" fill="#60a5fa" opacity="0.55" />
      {[40, 110].map((cy) => (
        <g key={"d" + cy}>
          <circle cx="45" cy={cy} r="12" fill="none" stroke="#f87171" strokeWidth="1.2" opacity="0.45" />
          <circle cx="45" cy={cy} r="1.5" fill="#f87171" opacity="0.45" />
        </g>
      ))}
      {[40, 110].map((cy) => (
        <g key={"o" + cy}>
          <circle cx="255" cy={cy} r="12" fill="none" stroke="#f87171" strokeWidth="1.2" opacity="0.45" />
          <circle cx="255" cy={cy} r="1.5" fill="#f87171" opacity="0.45" />
        </g>
      ))}
      <path d="M 4 60 A 16 16 0 0 1 4 90" fill="none" stroke="#60a5fa" strokeWidth="1.5" opacity="0.4" />
      <path d="M 296 60 A 16 16 0 0 0 296 90" fill="none" stroke="#60a5fa" strokeWidth="1.5" opacity="0.4" />
    </>
  );
}

function ShotRinkPicker({ selectedId }) {
  return (
    <svg viewBox="0 0 300 150" width="100%" height="auto">
      <rect x="0" y="0" width="300" height="150" fill="#09090b" />
      {SHOT_ZONES.map((c) => (
        <rect
          key={c.id}
          x={c.x}
          y={c.y}
          width={c.w}
          height={c.h}
          rx="4"
          className={c.id === selectedId ? "fill-emerald-500/30" : "fill-transparent hover:fill-emerald-500/10"}
        />
      ))}
      <RinkMarkings />
    </svg>
  );
}

function ShotRinkHeatmap({ counts, tone }) {
  const max = Math.max(1, ...Object.values(counts));
  const rgb = tone === "reign" ? "6,182,212" : "245,158,11";
  return (
    <svg viewBox="0 0 300 150" width="100%" height="auto">
      <rect x="0" y="0" width="300" height="150" fill="#09090b" />
      {SHOT_ZONES.map((c) => {
        const v = counts[c.id] || 0;
        const opacity = v > 0 ? 0.18 + 0.6 * (v / max) : 0.02;
        return <rect key={c.id} x={c.x} y={c.y} width={c.w} height={c.h} rx="4" style={{ fill: `rgba(${rgb},${opacity})` }} />;
      })}
      <RinkMarkings />
      {SHOT_ZONES.map((c) => {
        const v = counts[c.id] || 0;
        if (!v) return null;
        return (
          <text key={"t" + c.id} x={c.x + c.w / 2} y={c.y + c.h / 2 + 5} textAnchor="middle" fontSize="15" fontWeight="800" fill="#fff">
            {v}
          </text>
        );
      })}
    </svg>
  );
}

function ReignFlowDemo() {
  const [role, setRole] = useState("main");
  const [period, setPeriod] = useState(PERIODS.includes("3") ? "3" : PERIODS[0]); // for tracker-phone views
  const [viewMode, setViewMode] = useState("whole"); // 'whole' | 'custom'
  const [customSelected, setCustomSelected] = useState(PERIODS);

  function toggleSelected(p) {
    setCustomSelected((s) => (s.includes(p) ? s.filter((x) => x !== p) : [...s, p]));
  }

  const selected = viewMode === "whole" ? PERIODS : customSelected;

  const zoneAgg = aggregate(selected, (d) => d.zone);
  const possAgg = aggregate(selected, (d) => d.poss);
  const jointAgg = aggregateJoint(selected);
  const reignShotsAgg = aggregate(selected, (d) => d.shots.reign);
  const oppShotsAgg = aggregate(selected, (d) => d.shots.opp);
  const zoneTotal = ZONES.reduce((s, z) => s + (zoneAgg[z.id] || 0), 0);

  const data = PERIOD_DATA[period];

  return (
    <div className="bg-zinc-950 text-zinc-100 rounded-2xl overflow-hidden max-w-3xl mx-auto border border-zinc-800">
      <div className="flex items-center gap-2 px-4 sm:px-5 py-2 bg-amber-500/10 border-b border-amber-900/50 text-amber-300 text-xs font-medium">
        <Ed p="demo.banner" />
      </div>

      <div className="px-4 sm:px-5 pt-4 pb-3 border-b border-zinc-800 bg-zinc-900/60">
        <div className="text-xs tracking-wide text-zinc-500"><Ed p="demo.eyebrow" /></div>
        <div className="text-lg font-bold text-zinc-50 leading-tight"><Ed p="demo.title" /></div>
        <div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
          <button
            onClick={() => setRole("zone")}
            className={`py-2 rounded-lg text-xs font-semibold ${role === "zone" ? "bg-rose-600 text-white" : "bg-zinc-900 text-zinc-400 border border-zinc-700"}`}
          >
            <Ed p="demo.tabs.zone" nav />
          </button>
          <button
            onClick={() => setRole("possession")}
            className={`py-2 rounded-lg text-xs font-semibold ${role === "possession" ? "bg-cyan-600 text-white" : "bg-zinc-900 text-zinc-400 border border-zinc-700"}`}
          >
            <Ed p="demo.tabs.possession" nav />
          </button>
          <button
            onClick={() => setRole("shots")}
            className={`py-2 rounded-lg text-xs font-semibold ${role === "shots" ? "bg-emerald-600 text-white" : "bg-zinc-900 text-zinc-400 border border-zinc-700"}`}
          >
            <Ed p="demo.tabs.shots" nav />
          </button>
          <button
            onClick={() => setRole("main")}
            className={`py-2 rounded-lg text-xs font-semibold ${role === "main" ? "bg-amber-500 text-zinc-900" : "bg-zinc-900 text-zinc-400 border border-zinc-700"}`}
          >
            <Ed p="demo.tabs.main" nav />
          </button>
        </div>
      </div>

      {role !== "main" && (
        <div className="flex gap-1.5 px-4 sm:px-5 py-2.5 bg-zinc-900/30 border-b border-zinc-800">
          <span className="text-xs text-zinc-500 self-center mr-1"><Ed p="demo.periodLabel" /></span>
          {PERIODS.map((p) => (
            <button
              key={p}
              onClick={() => setPeriod(p)}
              className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${
                period === p ? "bg-cyan-600 text-white" : "bg-zinc-900 text-zinc-400 border border-zinc-700"
              }`}
            >
              {p}
            </button>
          ))}
        </div>
      )}

      <div className="p-4 sm:p-5">
        {role === "zone" && (
          <div>
            <div className="flex items-center justify-center gap-3 mb-1">
              <span className="text-sm text-zinc-400"><Ed p="demo.periodLabel" /> {period}</span>
              <span className="text-sm font-bold flex items-center gap-1 text-emerald-400"><RadioIcon size={14} /> <Ed p="demo.liveLabel" /></span>
            </div>
            <div className="text-center text-[11px] text-zinc-600 mb-4">
              {fmtTime(Object.values(data.zone).reduce((a, b) => a + b, 0))} <Ed p="demo.zoneScreen.elapsedNote" />
            </div>
            <div className="text-xs text-zinc-500 mb-2 text-center"><Ed p="demo.zoneScreen.instruction" /></div>
            <div className="grid grid-cols-1 gap-3">
              {ZONES.map((z) => (
                <button
                  key={z.id}
                  className={`py-8 rounded-xl font-bold text-lg border-2 ${
                    z.id === "D" ? "bg-cyan-700/40 border-cyan-500 text-cyan-100" : "bg-zinc-900 border-zinc-700 text-zinc-300"
                  }`}
                >
                  {z.label}
                </button>
              ))}
            </div>
            <div className="text-[11px] text-zinc-600 mt-4 text-center"><Ed p="demo.zoneScreen.exampleNote" /></div>
          </div>
        )}

        {role === "possession" && (
          <div>
            <div className="flex items-center justify-center gap-3 mb-1">
              <span className="text-sm text-zinc-400"><Ed p="demo.periodLabel" /> {period}</span>
              <span className="text-sm font-bold flex items-center gap-1 text-emerald-400"><RadioIcon size={14} /> <Ed p="demo.liveLabel" /></span>
            </div>
            <div className="text-center text-[11px] text-zinc-600 mb-4">
              {fmtTime(Object.values(data.poss).reduce((a, b) => a + b, 0))} <Ed p="demo.possessionScreen.elapsedNote" />
            </div>
            <div className="text-xs text-zinc-500 mb-2 text-center"><Ed p="demo.possessionScreen.instruction" /></div>
            <div className="grid grid-cols-1 gap-3">
              {POSSESSIONS.map((p) => (
                <button
                  key={p.id}
                  className={`py-8 rounded-xl font-bold text-lg border-2 ${
                    p.id === "opp" ? "bg-amber-700/40 border-amber-500 text-amber-100" : "bg-zinc-900 border-zinc-700 text-zinc-300"
                  }`}
                >
                  {p.label}
                </button>
              ))}
            </div>
            <div className="text-[11px] text-zinc-600 mt-4 text-center"><Ed p="demo.possessionScreen.exampleNote" /></div>
          </div>
        )}

        {role === "shots" && (
          <div>
            <div className="flex items-center justify-center gap-3 mb-1">
              <span className="text-sm text-zinc-400"><Ed p="demo.periodLabel" /> {period}</span>
              <span className="text-sm font-bold flex items-center gap-1 text-emerald-400"><RadioIcon size={14} /> <Ed p="demo.liveLabel" /></span>
            </div>
            <div className="text-center text-[11px] text-zinc-600 mb-4">
              {Object.values(data.shots.reign).reduce((a, b) => a + b, 0) + Object.values(data.shots.opp).reduce((a, b) => a + b, 0)} <Ed p="demo.shotsScreen.loggedNote" />
            </div>
            <div className="flex gap-2 mb-3">
              <button className="flex-1 py-2 rounded-lg text-sm font-semibold bg-zinc-100 text-zinc-900"><Ed p="demo.shotsScreen.reignButton" /></button>
              <button className="flex-1 py-2 rounded-lg text-sm font-semibold bg-zinc-900 text-zinc-400 border border-zinc-700"><Ed p="demo.shotsScreen.opponentButton" /></button>
            </div>
            <div className="text-xs text-zinc-500 mb-2 text-center"><Ed p="demo.shotsScreen.instruction" /></div>
            <ShotRinkPicker selectedId="OC" />
            <div className="text-[11px] text-zinc-600 mt-3 text-center"><Ed p="demo.shotsScreen.exampleNote" /></div>
          </div>
        )}

        {role === "main" && (
          <div>
            <div className="rounded-xl border border-amber-900/50 bg-amber-500/5 p-3 mb-5">
              <div className="text-xs font-semibold text-amber-400 mb-2"><Ed p="demo.main.trackControlTitle" /></div>
              <div className="flex gap-1.5 mb-2">
                {PERIODS.map((p) => (
                  <button key={p} className={`px-3 py-1.5 rounded-lg text-sm font-semibold ${p === "3" ? "bg-cyan-600 text-white" : "bg-zinc-900 text-zinc-400 border border-zinc-700"}`}>
                    {p}
                  </button>
                ))}
              </div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <button className="py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-2 bg-emerald-600 text-white">
                  <RadioIcon size={14} /> <Ed p="demo.main.markLive" />
                </button>
                <button className="py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-2 bg-zinc-900 border border-zinc-700 text-zinc-400">
                  <PauseIcon size={14} /> <Ed p="demo.main.markStopped" />
                </button>
              </div>
              <div className="text-[10px] text-zinc-600">
                <Ed p="demo.main.trackControlNote" />
              </div>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-900/40 p-3 mb-5">
              <div className="text-xs font-semibold text-zinc-300 mb-2"><Ed p="demo.main.summaryTitle" /></div>
              <div className="flex gap-2 mb-2">
                <button
                  onClick={() => setViewMode("whole")}
                  className={`flex-1 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center gap-2 ${
                    viewMode === "whole" ? "bg-cyan-600 text-white" : "bg-zinc-900 text-zinc-400 border border-zinc-700"
                  }`}
                >
                  <RadioIcon size={14} /> <Ed p="demo.main.wholeGameButton" nav />
                </button>
                <button
                  onClick={() => setViewMode("custom")}
                  className={`flex-1 py-2.5 rounded-lg text-sm font-semibold ${
                    viewMode === "custom" ? "bg-zinc-100 text-zinc-900" : "bg-zinc-900 text-zinc-400 border border-zinc-700"
                  }`}
                >
                  <Ed p="demo.main.drillButton" nav />
                </button>
              </div>
              {viewMode === "custom" && (
                <div className="flex gap-1.5 mb-2 flex-wrap">
                  {PERIODS.map((p) => (
                    <button
                      key={p}
                      onClick={() => toggleSelected(p)}
                      className={`px-3 py-1.5 rounded-lg text-sm font-semibold border ${
                        customSelected.includes(p) ? "bg-cyan-600 text-white border-cyan-600" : "bg-zinc-900 text-zinc-500 border-zinc-700"
                      }`}
                    >
                      {p}
                    </button>
                  ))}
                </div>
              )}
              <div className="text-[11px] text-zinc-500">
                <Ed p="demo.main.viewingLabel" /> <span className="text-zinc-300 font-semibold">{periodsLabel(selected)}</span>
                {viewMode === "whole" && <span className="text-zinc-600"><Ed p="demo.main.wholeGameNote" /></span>}
              </div>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4 mb-4">
              <div className="text-xs text-zinc-500 mb-3"><Ed p="demo.main.zoneTimeTitle" /> <span className="text-zinc-600"><Ed p="demo.main.phoneTapHint" /></span></div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                {ZONES.map((z) => (
                  <ZoneTimeCard key={z.id} zone={z} value={zoneAgg[z.id] || 0} total={zoneTotal} />
                ))}
              </div>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4 mb-4">
              <div className="text-xs text-zinc-500 mb-3"><Ed p="demo.main.possessionByZoneTitle" /> <span className="text-zinc-600"><Ed p="demo.main.phoneTapHint" /></span></div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                {ZONES.map((z) => (
                  <PossessionZoneCard key={z.id} zone={z} row={jointAgg[z.id]} />
                ))}
              </div>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4 mb-4">
              <div className="text-xs text-zinc-500 mb-3"><Ed p="demo.main.shotLocationsTitle" /></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <div className="text-[11px] text-cyan-400 font-semibold mb-1.5 text-center">
                    <Ed p="demo.main.reignShotsLabel" /> ({Object.values(reignShotsAgg).reduce((a, b) => a + b, 0)})
                  </div>
                  <ShotRinkHeatmap counts={reignShotsAgg} tone="reign" />
                </div>
                <div>
                  <div className="text-[11px] text-amber-400 font-semibold mb-1.5 text-center">
                    <Ed p="demo.main.opponentShotsLabel" /> ({Object.values(oppShotsAgg).reduce((a, b) => a + b, 0)})
                  </div>
                  <ShotRinkHeatmap counts={oppShotsAgg} tone="opp" />
                </div>
              </div>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4 mb-4">
              <div className="text-xs text-zinc-500 mb-2">{periodsLabel(selected)}</div>
              <ReportRows buckets={zoneAgg} labels={ZONES} />
              <div className="h-px bg-zinc-800 my-3" />
              <ReportRows buckets={possAgg} labels={POSSESSIONS} />
              <div className="text-[11px] text-zinc-600 mt-3">
                <Ed p="demo.main.reference" />
              </div>
            </div>

            <div>
              <div className="text-xs text-zinc-500 mb-2"><Ed p="demo.main.activityLogTitle" /></div>
              <div className="space-y-1">
                {EXAMPLE_LOG.map((e, i) => (
                  <div key={i} className="flex items-center justify-between bg-zinc-900/50 rounded-lg px-2.5 py-1.5 text-xs">
                    <span className="text-zinc-400">{e.t} · {e.text}</span>
                    <TrashIcon size={13} className="text-zinc-700" />
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


const CARD_COLORS = { cyan: "text-cyan-400", amber: "text-amber-400", emerald: "text-emerald-400", rose: "text-rose-400", white: "text-zinc-200" };

function RichText({ text }) {
  return text.split(/(\*\*[^*]+\*\*)/g).map((part, i) =>
    part.startsWith("**") ? <span key={i} className="text-zinc-200 font-semibold">{part.slice(2, -2)}</span> : part
  );
}

// Popover that opens when you click any editable text in edit mode
function Editor({ path, onClose, onSave }) {
  const [val, setVal] = useState(getPath(C, path) || "");
  const long = val.length > 60 || /\*\*/.test(val);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-4" onClick={onClose}>
      <div className="w-full max-w-lg rounded-2xl border border-zinc-700 bg-zinc-900 p-4" onClick={(e) => e.stopPropagation()}>
        <div className="text-xs text-zinc-500 mb-2">Edit text{long ? " — use **double asterisks** for bold" : ""}</div>
        <textarea
          autoFocus
          value={val}
          onChange={(e) => setVal(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey && !long) { e.preventDefault(); onSave(val); } if (e.key === "Escape") onClose(); }}
          rows={long ? 5 : 2}
          className="w-full rounded-lg bg-zinc-950 border border-zinc-700 text-zinc-100 text-sm p-2.5 outline-none focus:border-cyan-500"
        />
        <div className="flex justify-end gap-2 mt-3">
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm bg-zinc-800 text-zinc-300">Cancel</button>
          <button onClick={() => onSave(val)} className="px-4 py-2 rounded-lg text-sm font-semibold bg-cyan-600 text-white">Save</button>
        </div>
      </div>
    </div>
  );
}

// Plain form for every leaf value under an object (names, example numbers, log lines)
function Fields({ obj, path, onChange }) {
  return (
    <div className="space-y-1.5">
      {Object.keys(obj).map((k) => {
        const v = obj[k];
        const here = path ? path + "." + k : k;
        if (v !== null && typeof v === "object")
          return (
            <div key={k} className="pl-3 border-l border-zinc-800">
              <div className="text-[11px] text-zinc-500 mt-2 mb-1">{k}</div>
              <Fields obj={v} path={here} onChange={onChange} />
            </div>
          );
        return (
          <label key={k} className="flex items-center gap-2 text-xs">
            <span className="w-24 shrink-0 text-zinc-400">{k}</span>
            <input
              type={typeof v === "number" ? "number" : "text"}
              value={v}
              onChange={(e) => onChange(here, typeof v === "number" ? Number(e.target.value) : e.target.value)}
              className="flex-1 min-w-0 rounded-md bg-zinc-950 border border-zinc-700 text-zinc-100 px-2 py-1 outline-none focus:border-cyan-500"
            />
          </label>
        );
      })}
    </div>
  );
}

function DataPanel({ onChange }) {
  return (
    <section className="mb-6 rounded-2xl border border-cyan-900/60 bg-cyan-950/10 p-4">
      <div className="text-sm font-bold text-cyan-300 mb-1">Edit mode — extra fields</div>
      <div className="text-xs text-zinc-500 mb-3">Everything else you edit by clicking the text on the page. These are the things you can't click (buttons you need for switching views) and the example numbers.</div>
      <details className="mb-2"><summary className="text-sm text-zinc-300 cursor-pointer">Tab &amp; zone names</summary>
        <div className="mt-2"><Fields obj={{ tabs: C.demo.tabs, zoneNames: C.demo.zoneNames, possessionNames: C.demo.possessionNames }} path="demo" onChange={onChange} /></div>
      </details>
      <details className="mb-2"><summary className="text-sm text-zinc-300 cursor-pointer">Summary toggle buttons</summary>
        <div className="mt-2"><Fields obj={{ wholeGameButton: C.demo.main.wholeGameButton, drillButton: C.demo.main.drillButton }} path="demo.main" onChange={onChange} /></div>
      </details>
      <details className="mb-2"><summary className="text-sm text-zinc-300 cursor-pointer">Example numbers (seconds / shot counts)</summary>
        <div className="mt-2"><Fields obj={C.data.periods} path="data.periods" onChange={onChange} /></div>
      </details>
    </section>
  );
}

function Page() {
  const params = new URLSearchParams(location.search);
  const canEdit = params.has("edit");
  const [editing, setEditing] = useState(false);
  const [, setVer] = useState(0);
  const [editPath, setEditPath] = useState(null);
  const bump = () => { saveContent(); setVer((v) => v + 1); };

  useEffect(() => { document.title = C.pageTitle; });
  useEffect(() => {
    document.body.classList.toggle("edit-on", editing);
    if (!editing) return;
    const h = (e) => {
      if (e.target.closest("[data-editor-ui]")) return;
      const el = e.target.closest("[data-edit]");
      if (el) { e.preventDefault(); e.stopPropagation(); setEditPath(el.getAttribute("data-edit")); }
    };
    document.addEventListener("click", h, true);
    return () => document.removeEventListener("click", h, true);
  }, [editing]);

  const onField = (path, val) => { setPath(C, path, val); bump(); };
  const addCard = (si) => { C.sections[si].cards.push({ color: "white", title: "New card", body: "Click to edit this text." }); bump(); };
  const removeCard = (si, ci) => { if (confirm("Remove this card?")) { C.sections[si].cards.splice(ci, 1); bump(); } };
  const moveCard = (si, ci, d) => { const a = C.sections[si].cards; const j = ci + d; if (j < 0 || j >= a.length) return; [a[ci], a[j]] = [a[j], a[ci]]; bump(); };

  function download() {
    const txt = "// Saved from the in-page editor. Replace content.js with this file to publish these edits.\nwindow.CONTENT = " + JSON.stringify(C, null, 2) + ";\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    a.download = "content.js";
    a.click();
  }
  function resetAll() {
    if (!confirm("Throw away all edits made in this browser and go back to content.js?")) return;
    try { localStorage.removeItem("reign-demo-content"); } catch (e) {}
    location.reload();
  }

  return (
    <EditCtx.Provider value={{ editing }}>
      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14 pb-28">
        <header className="mb-8">
          <div className="text-xs tracking-widest text-cyan-400 font-semibold uppercase mb-2"><Ed p="header.eyebrow" /></div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-zinc-50 leading-tight"><Ed p="header.title" /></h1>
        </header>

        {C.sections.map((sec, i) => (
          <section key={i} className="mb-10">
            <h2 className="text-base font-bold text-zinc-100 mb-4"><Ed p={`sections.${i}.title`} /></h2>
            <div className="space-y-3">
              {sec.cards.map((card, j) => (
                <div key={j} className="rounded-xl border border-zinc-800 bg-zinc-900/50 p-4">
                  <div className={`${CARD_COLORS[card.color] || CARD_COLORS.white} font-bold text-sm mb-1`}><Ed p={`sections.${i}.cards.${j}.title`} /></div>
                  <p className="text-zinc-400 text-sm leading-relaxed"><Ed p={`sections.${i}.cards.${j}.body`} rich /></p>
                  {editing && (
                    <div data-editor-ui className="flex flex-wrap items-center gap-2 mt-3 text-[11px]">
                      <select value={card.color} onChange={(e) => onField(`sections.${i}.cards.${j}.color`, e.target.value)} className="bg-zinc-950 border border-zinc-700 rounded px-1.5 py-1 text-zinc-300">
                        {Object.keys(CARD_COLORS).map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <button onClick={() => moveCard(i, j, -1)} className="px-2 py-1 rounded bg-zinc-800 text-zinc-300">↑</button>
                      <button onClick={() => moveCard(i, j, 1)} className="px-2 py-1 rounded bg-zinc-800 text-zinc-300">↓</button>
                      <button onClick={() => removeCard(i, j)} className="px-2 py-1 rounded bg-zinc-800 text-rose-400">Remove</button>
                    </div>
                  )}
                </div>
              ))}
              {editing && (
                <button data-editor-ui onClick={() => addCard(i)} className="w-full py-2 rounded-xl border border-dashed border-cyan-800 text-cyan-400 text-sm">+ Add card</button>
              )}
            </div>
          </section>
        ))}

        <section className="mb-6">
          <h2 className="text-base font-bold text-zinc-100 mb-1"><Ed p="tryIt.title" /></h2>
          <p className="text-zinc-500 text-xs mb-4"><Ed p="tryIt.subtitle" /></p>
          <ReignFlowDemo />
        </section>

        {editing && <div data-editor-ui><DataPanel onChange={onField} /></div>}

        <footer className="text-center text-zinc-700 text-xs mt-14 pb-4"><Ed p="footer" /></footer>
      </div>

      {canEdit && (
        <div data-editor-ui className="fixed bottom-0 inset-x-0 z-40 flex flex-wrap items-center justify-center gap-2 px-3 py-3 bg-zinc-900/95 border-t border-zinc-700 backdrop-blur">
          <button onClick={() => setEditing((v) => !v)} className={`px-4 py-2 rounded-lg text-sm font-semibold ${editing ? "bg-cyan-600 text-white" : "bg-zinc-800 text-zinc-200 border border-zinc-600"}`}>
            {editing ? "✓ Done editing" : "✎ Edit page"}
          </button>
          <button onClick={download} className="px-3 py-2 rounded-lg text-sm bg-zinc-800 text-zinc-200 border border-zinc-600">Download content.js</button>
          <button onClick={resetAll} className="px-3 py-2 rounded-lg text-sm bg-zinc-800 text-rose-300 border border-zinc-600">Reset</button>
          {editing && <span className="text-[11px] text-zinc-500 w-full text-center">Click any dashed text to edit it. Changes save automatically in this browser.</span>}
        </div>
      )}

      {editPath && (
        <Editor path={editPath} onClose={() => setEditPath(null)} onSave={(v) => { setPath(C, editPath, v); setEditPath(null); bump(); }} />
      )}
    </EditCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("page-root")).render(<Page />);
</script>

</body>
</html>
